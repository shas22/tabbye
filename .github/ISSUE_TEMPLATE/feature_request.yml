name: Feature request
description: Suggest an improvement to Tabbye.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Privacy, permission, or data tradeoffs
      description: Would this need new permissions, network access, or changes to stored data?
